- Use TDD: confirm RED, implement the minimum change, then confirm GREEN.
- Run the assigned tests and typecheck before reporting completion.
- Make no architectural or scope decisions; return BLOCKED when required input is missing.
- Return the structured RESULT block required by realm-orchestrate.
"""
